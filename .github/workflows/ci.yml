name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          check-latest: true
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Validate goreleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check

  skill:
    name: Verify skills are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          check-latest: true
      - name: Regenerate skills
        run: go run ./cmd/gw2 generate-skills
      - name: Fail on drift
        run: |
          git add -A skills/
          if ! git diff --cached --exit-code skills/; then
            echo "::error::skills/ is out of date — run 'go run ./cmd/gw2 generate-skills' and commit."
            exit 1
          fi

  version-sync:
    name: Verify npm package version placeholder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check npm/package.json holds the 0.0.0 placeholder
        run: |
          # The release workflow stamps the real version at publish time via
          # `npm version <VERSION>`, which errors on a same-version stamp, so
          # the committed package.json must stay at the 0.0.0 placeholder.
          npm_version="$(node -p "require('./npm/package.json').version")"
          if [ "${npm_version}" != "0.0.0" ]; then
            echo "::error::npm/package.json version is ${npm_version}; it must stay at the 0.0.0 placeholder — the release workflow stamps the real version at publish."
            exit 1
          fi
